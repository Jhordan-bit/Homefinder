spring.application.name=backend

#Parametros de la nube
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=${PORT:8080}

# URL de conexión (traerá el valor desde Render)
spring.datasource.url=${DB_URL}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Formato para agregar imagenes(para las imagenes de las viviendas)
spring.web.resources.static-locations=file:uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Forzar el dialecto para evitar errores de auto-detección
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect